<!doctype html>
<meta charset="utf-8">
<title>favicon preview</title>
<style>
  html,body{margin:0;background:#3a3a3a;font:12px/1.2 sans-serif;color:#eee}
  .row{display:flex;gap:24px;align-items:flex-end;padding:16px}
  figure{margin:0;text-align:center}
  img{image-rendering:auto;display:block}
  .on-dark{background:#0c0d0b}
  .on-light{background:#eceae4}
  figcaption{margin-top:6px}
</style>
<div class="row">
  <figure><img class="on-dark" src="./favicon.svg" width="16" height="16" alt="16"><figcaption>16 dark</figcaption></figure>
  <figure><img class="on-light" src="./favicon.svg" width="16" height="16" alt="16l"><figcaption>16 light</figcaption></figure>
  <figure><img class="on-dark" src="./favicon.svg" width="32" height="32" alt="32"><figcaption>32</figcaption></figure>
  <figure><img class="on-dark" src="./favicon.svg" width="64" height="64" alt="64"><figcaption>64</figcaption></figure>
</div>
